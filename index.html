<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d9d4c9">
  <title>tinytoast.dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#21201e; --paper:#f6f3eb; --counter:#d9d4c9; --accent:#e94b3c; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:35px 20px; color:var(--ink); background:var(--counter); font:14px/1.5 "DM Mono",ui-monospace,monospace; }
    .receipt { position:relative; width:min(430px,100%); padding:32px 30px 40px; background:linear-gradient(90deg,rgba(0,0,0,.025),transparent 8%,transparent 92%,rgba(0,0,0,.025)),var(--paper); filter:drop-shadow(8px 9px 0 rgba(33,32,30,.25)); }
    .receipt::after { position:absolute; right:0; bottom:-13px; left:0; height:14px; content:""; background:linear-gradient(135deg,transparent 9px,var(--paper) 0) 0 0/18px 14px repeat-x,linear-gradient(225deg,transparent 9px,var(--paper) 0) 0 0/18px 14px repeat-x; }
    .center { text-align:center; }
    .logo { display:block; width:75px; margin:8px auto 14px; image-rendering:pixelated; filter:grayscale(1) contrast(1.3); }
    h1 { margin:0 0 2px; font-size:18px; letter-spacing:.12em; }
    .sub { margin:0 0 20px; font-size:11px; letter-spacing:.1em; }
    .rule { margin:18px 0; border:0; border-top:2px dashed var(--ink); }
    .line-item { display:flex; align-items:center; justify-content:space-between; gap:16px; margin:0 -8px; padding:10px 8px; color:inherit; text-decoration:none; transition:background 120ms ease,color 120ms ease; }
    .line-item:hover { color:var(--accent); background:#fffdf8; }
    .item-name { font-weight:700; text-decoration:underline dashed 1px; text-underline-offset:4px; }
    small { display:block; font-size:11px; }
    .action { flex:none; font-size:12px; text-decoration:underline; text-underline-offset:4px; }
    .total { margin-top:14px; font-size:16px; font-weight:700; }
    .barcode { width:78%; height:46px; margin:26px auto 15px; background:repeating-linear-gradient(90deg,#222 0 2px,transparent 2px 4px,#222 4px 5px,transparent 5px 8px,#222 8px 12px,transparent 12px 14px); }
    .fine { margin:0; font-size:10px; line-height:1.45; text-align:center; }
    a { color:inherit; font-size:11px; text-underline-offset:4px; }
    a:hover { color:var(--accent); }
    a:focus-visible { outline:2px solid var(--accent); outline-offset:4px; }
  </style>
</head>
<body>
  <main class="receipt">
    <div class="center">
      <img class="logo" src="/assets/tinytoast-logo.svg" alt="A tiny piece of toast">
      <h1>TINYTOAST.DEV</h1>
      <p class="sub">A SMALL WEB PRESENCE &nbsp; · &nbsp; NO. 000001</p>
    </div>
    <hr class="rule">
    <a class="line-item" href="/identity/"><span><span class="item-name">public identity</span><small>a key for verifying messages and files</small></span><span class="action">view ↗</span></a>
    <a class="line-item" href="https://github.com/sonrohan"><span><span class="item-name">github</span><small>things made by rohan</small></span><span class="action">visit ↗</span></a>
    <hr class="rule">
    <div class="row total"><span>AMOUNT DUE</span><span>NOTHING</span></div>
    <div class="barcode" aria-hidden="true"></div>
    <p class="fine">TINYTOAST.DEV<br>KEEP THIS RECEIPT FOR REFERENCE.</p>
  </main>
</body>
</html>
